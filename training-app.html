<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Essentials</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --green:#00E5A0;
    --green-dim:rgba(0,229,160,0.12);
    --bg:#000;
    --c1:#1C1C1E;
    --c2:#2C2C2E;
    --c3:#3A3A3C;
    --t1:#fff;
    --t2:rgba(235,235,245,.8);
    --t3:rgba(235,235,245,.5);
    --t4:rgba(235,235,245,.3);
    --red:#FF453A;
    --blue:#0A84FF;
    --st:env(safe-area-inset-top,0px);
    --sb:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;overscroll-behavior:none}

  /* ── LAYOUT ── */
  #app{display:flex;flex-direction:column;height:100%}
  #tabs{display:flex;padding:calc(var(--st) + 10px) 16px 0;gap:4px;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
  .tab{flex:1;padding:10px 6px 12px;text-align:center;font-size:12px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent;cursor:pointer;transition:.2s;letter-spacing:.2px}
  .tab.active{color:var(--green);border-color:var(--green)}
  #content{flex:1;overflow-y:auto;padding-bottom:calc(20px + var(--sb))}
  #content::-webkit-scrollbar{display:none}

  /* ── DAY LIST (past/upcoming) ── */
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);padding:20px 16px 8px}
  .day-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s}
  .day-row:active{background:rgba(255,255,255,.03)}
  .day-num{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  .day-num.done{background:var(--green-dim);color:var(--green)}
  .day-num.skipped{background:rgba(255,69,58,.1);color:var(--red)}
  .day-num.upcoming{background:var(--c1);color:var(--t3)}
  .day-info{flex:1;min-width:0}
  .day-title{font-size:15px;font-weight:600;color:var(--t1)}
  .day-meta{font-size:12px;color:var(--t3);margin-top:2px}
  .day-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .badge-done{background:var(--green-dim);color:var(--green)}
  .badge-skip{background:rgba(255,69,58,.12);color:var(--red)}
  .chevron{color:var(--t4);font-size:16px}

  /* ── CURRENT DAY VIEW ── */
  #cur-header{padding:calc(var(--st) + 16px) 16px 0}
  .cur-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--green);margin-bottom:6px}
  .cur-title{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
  .cur-sub{font-size:13px;color:var(--t3);margin-top:4px}
  .cur-week{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;background:var(--green-dim);color:var(--green);padding:4px 12px;border-radius:20px}

  /* ── EXERCISE CARDS ── */
  #exercises{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .ex-card{background:var(--c1);border-radius:16px;overflow:hidden;transition:background .2s,border .2s;border:1px solid transparent}
  .ex-card.has-load{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)}
  .ex-top{display:flex;align-items:center;gap:12px;padding:14px 14px 12px}
  .ex-name-block{flex:1;min-width:0}
  .ex-name{font-size:15px;font-weight:600;line-height:1.3}
  .ex-sets{font-size:12px;color:var(--t3);margin-top:3px}
  .info-btn{width:30px;height:30px;border-radius:50%;background:var(--c2);border:none;color:var(--t3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ex-check{width:30px;height:30px;border-radius:50%;background:var(--c2);border:none;color:var(--t4);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-family:inherit}
  .ex-check.active{background:var(--green-dim);color:var(--green)}

  /* ── LOAD POPUP ── */
  #load-popup{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  #load-popup.open{display:flex}
  #load-popup-bg{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
  #load-popup-box{position:relative;z-index:1;width:100%;max-width:340px;background:var(--c1);border-radius:20px;padding:24px 20px 20px}
  .popup-handle{width:36px;height:4px;background:var(--c3);border-radius:2px;margin:12px auto 16px}
  .popup-title{font-size:16px;font-weight:700;margin-bottom:4px}
  .popup-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
  .popup-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .popup-input{flex:1;background:var(--c2);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:700;color:var(--t1);font-family:inherit;outline:none;transition:border .2s}
  .popup-input:focus{border-color:rgba(0,229,160,.5)}
  .popup-unit{font-size:14px;font-weight:600;color:var(--t3)}
  .popup-save{width:100%;padding:15px;border-radius:12px;border:none;background:var(--green);color:#000;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
  .ex-bottom{padding:0 14px 14px;display:flex;align-items:center;gap:10px}
  .load-label{font-size:12px;color:var(--t3);flex-shrink:0}
  .load-input{flex:1;background:var(--c2);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;font-size:16px;font-weight:600;color:var(--t1);font-family:inherit;outline:none;transition:border .2s}
  .load-input:focus{border-color:rgba(0,229,160,.4)}
  #exercises{--session-color:var(--green)}
  .load-unit{font-size:12px;color:var(--t3);flex-shrink:0}

  /* ── FINISH BAR ── */
  #finish-bar{padding:14px 16px 4px;display:flex;gap:10px}
  .btn{flex:1;padding:15px;border-radius:14px;border:none;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
  .btn:active{opacity:.75;transform:scale(.98)}
  .btn-done{background:var(--green);color:#000}
  .btn-skip{background:var(--c1);color:var(--t3)}

  /* ── MODAL ── */
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:50;display:none;align-items:flex-end}
  #overlay.open{display:flex}
  #modal{background:var(--c1);border-radius:24px 24px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:0 0 calc(24px + var(--sb))}
  #modal::-webkit-scrollbar{display:none}
  .modal-handle{width:36px;height:4px;background:var(--c3);border-radius:2px;margin:12px auto 0}
  .modal-title{font-size:18px;font-weight:700;padding:16px 20px 4px;letter-spacing:-.3px}
  .modal-sub{font-size:13px;color:var(--t3);padding:0 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
  .modal-row{display:flex;justify-content:space-between;align-items:flex-start;padding:13px 20px;border-bottom:1px solid rgba(255,255,255,.04);gap:16px}
  .modal-row:last-child{border-bottom:none}
  .modal-key{font-size:13px;color:var(--t3)}
  .modal-val{font-size:13px;font-weight:600;text-align:right;max-width:65%}
  .modal-notes{padding:12px 20px;font-size:13px;color:var(--t2);line-height:1.6;background:rgba(255,255,255,.03);margin:0 16px;border-radius:12px}
  .modal-video{border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:center;background:#000}
  .modal-video iframe{width:100%;aspect-ratio:16/9;display:block;border:none}
  .modal-sub-link:active{opacity:.7}
  .modal-close{display:block;margin:16px 16px 0;width:calc(100% - 32px);padding:15px;background:var(--c2);border:none;border-radius:14px;font-size:15px;font-weight:600;color:var(--t2);font-family:inherit;cursor:pointer}

  /* ── SETTINGS BAR (in detail view) ── */
  .back-bar{display:flex;align-items:center;gap:8px;padding:calc(var(--st) + 14px) 16px 0;cursor:pointer}
  .back-arrow{font-size:20px;color:var(--green)}
  .back-label{font-size:16px;font-weight:600;color:var(--green)}
  .detail-day-title{font-size:22px;font-weight:700;padding:10px 16px 0;letter-spacing:-.4px}
  .detail-day-meta{font-size:13px;color:var(--t3);padding:4px 16px 0}
  .detail-status-row{padding:12px 16px;display:flex;gap:10px}
  .status-chip{font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;border:none;cursor:pointer;font-family:inherit;transition:.15s}
  .status-chip.active-done{background:var(--green);color:#000}
  .status-chip.active-skip{background:var(--red);color:#fff}
  .status-chip.inactive{background:var(--c1);color:var(--t3)}

  /* ── EMPTY STATE ── */
  .empty{padding:60px 20px;text-align:center;color:var(--t3)}
  .empty-icon{font-size:40px;margin-bottom:12px}
  .empty-txt{font-size:14px}

  /* ── ADD TRAINING ── */
  .add-training-wrap{padding:20px 16px 32px}
  .add-training-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:16px;border:1.5px dashed rgba(0,229,160,.3);background:rgba(0,229,160,.05);color:var(--green);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
  .add-training-btn:active{background:rgba(0,229,160,.1)}
  .add-training-btn-icon{width:26px;height:26px;border-radius:50%;background:rgba(0,229,160,.15);display:flex;align-items:center;justify-content:center;font-size:15px}

  /* ── SESSION PICKER POPUP ── */
  #session-popup{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end}
  #session-popup.open{display:flex}
  #session-popup-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px)}
  #session-popup-box{position:relative;z-index:1;width:100%;background:var(--c1);border-radius:24px 24px 0 0;padding:0 16px calc(28px + var(--sb)) 16px;max-height:85vh;overflow-y:auto}
  #session-popup-box::-webkit-scrollbar{display:none}
  .spop-handle{width:36px;height:4px;background:var(--c3);border-radius:2px;margin:12px auto 20px}
  .spop-title{font-size:19px;font-weight:700;letter-spacing:-.4px;margin-bottom:4px}
  .spop-sub{font-size:13px;color:var(--t3);margin-bottom:20px}
  .spop-auto{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:rgba(0,229,160,.08);border:1.5px solid rgba(0,229,160,.2);margin-bottom:20px;cursor:pointer;transition:all .2s;width:100%;font-family:inherit;text-align:left}
  .spop-auto:active{background:rgba(0,229,160,.14)}
  .spop-auto-icon{width:44px;height:44px;border-radius:12px;background:rgba(0,229,160,.15);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .spop-auto-label{font-size:15px;font-weight:700;color:var(--green);letter-spacing:-.2px}
  .spop-auto-meta{font-size:12px;color:rgba(0,229,160,.6);margin-top:3px}
  .spop-divider{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4);margin:0 0 12px}
  .spop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .spop-tile{display:flex;flex-direction:column;gap:4px;padding:16px 14px;border-radius:16px;background:var(--c2);cursor:pointer;transition:all .2s;font-family:inherit;text-align:left;border:1.5px solid transparent}
  .spop-tile:active{background:var(--c3)}
  .spop-tile-bar{width:28px;height:3px;border-radius:2px;margin-bottom:6px}
  .spop-tile-name{font-size:15px;font-weight:700;color:var(--t1)}
  .spop-tile-meta{font-size:11px;color:var(--t3)}
  .spop-cancel{width:100%;padding:15px;border-radius:14px;border:none;background:var(--c2);color:var(--t3);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="tabs">
    <div class="tab" id="tab-past" onclick="switchTab('past')">Past</div>
    <div class="tab active" id="tab-today" onclick="switchTab('today')">Today</div>
    <div class="tab" id="tab-upcoming" onclick="switchTab('upcoming')">Upcoming</div>
  </div>
  <div id="content">
    <!-- filled by JS -->
  </div>
</div>

<!-- Session Picker Popup -->
<div id="session-popup" onclick="closeSessionPopup()">
  <div id="session-popup-bg"></div>
  <div id="session-popup-box" onclick="event.stopPropagation()">
    <div class="spop-handle"></div>
    <div class="spop-title">Add Workout</div>
    <div class="spop-sub">Choose an option</div>
    <div id="session-popup-body"></div>
    <button class="spop-cancel" onclick="closeSessionPopup()">Cancel</button>
  </div>
</div>

<!-- Load Popup -->
<div id="load-popup" onclick="closeLoadPopup()">
  <div id="load-popup-bg"></div>
  <div id="load-popup-box" onclick="event.stopPropagation()">
    <div class="popup-title" id="popup-ex-name"></div>
    <div class="popup-sub" id="popup-ex-sets"></div>
    <div class="popup-row">
      <input class="popup-input" id="popup-input" type="text" inputmode="decimal" placeholder="e.g. 40" />
      <span class="popup-unit">kg</span>
    </div>
    <button class="popup-save" onclick="saveLoadFromPopup()">Save</button>
  </div>
</div>

<!-- Modal -->
<div id="overlay" onclick="closeModal()">
  <div id="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// PLAN DATA
// ═══════════════════════════════════════════
// Each training day has a type label + exercises
// Exercise: { name, warmup, working, reps, rpe, rest, notes, sub1, sub2 }

const PLAN = (()=>{
  const days = [];

  function d(label, type, exs){ return {label, type, exercises: exs} }
  function e(name, warmup, working, reps, rpe, rest, notes, sub1, sub2, video, sub1url, sub2url){
    return {name, warmup, working, reps, rpe, rest, notes:notes||'', sub1:sub1||'', sub2:sub2||'', video:video||'', sub1url:sub1url||'', sub2url:sub2url||''}
  }

  // ── BLOCK 1 (Wo 1-4): 4 sessions per week ──────────────────
  const B1 = [
    d('Upper A','upper',[
      e('Flat DB Press (Heavy)','2–3',1,'4–6','8–9','~3 min','Focus on strength here. Each week add weight or reps. Keep form consistent.','Machine Chest Press','Weighted Dip', 'https://youtu.be/axoeDmW0oAY?t=185', 'https://youtu.be/ZOg0CcJCKrk', 'https://youtu.be/FbWfA_s0XL8?t=273'),
      e('Flat DB Press (Back off)',0,1,'8–10','9–10','~3 min','Focus on mind-muscle connection with pecs. Drop the weight back and focus on stretch and squeeze!','Machine Chest Press','Weighted Dip', 'https://youtu.be/axoeDmW0oAY?t=185', 'https://youtu.be/ZOg0CcJCKrk', 'https://youtu.be/FbWfA_s0XL8?t=273'),
      e('2-Grip Lat Pulldown',2,2,'10–12','9–10','~2 min','Do first set wide overhand (1.5x shoulder width), second set underhand (1x shoulder width).','2-Grip Pull-up','Machine Pulldown', 'https://www.youtube.com/watch?v=flr4ohSl0j8', 'https://youtu.be/ae9IxwoEpQ8?t=507', 'https://www.youtube.com/watch?v=zOpA1Op0zvc'),
      e('Seated DB Shoulder Press',1,2,'10–12','9–10','~2 min','Bring the dumbbells all the way down, keep your torso upright.','Machine Shoulder Press','Standing DB Arnold Press', 'https://youtu.be/Hdc7Mw6BIEE?t=99', 'https://youtu.be/O94yEoGXtBY?t=150', 'https://youtu.be/3FnK1F28UBg'),
      e('Seated Cable Row',1,2,'10–12 (dropset)','9–10','~2 min','Focus on squeezing your shoulder blades together, drive your elbows down and back. Load set: dropset – 10–12 reps, drop ~50%, perform additional 10–12 reps.','Incline Chest-Supported DB Row','Chest-Supported T-Bar Row', 'https://youtu.be/fV6G1aQb9mM', 'https://youtu.be/yN6Q1UI_xkE?t=75', 'https://youtu.be/URQ1Wn7lY3A'),
      e('A1: EZ Bar Skull Crusher',1,2,'12–15','10','0 min','Arc the bar behind your head, constant tension on triceps.','Overhead Cable Triceps Extension','DB French Press', 'https://youtu.be/acC5hLyjEDI', 'https://youtu.be/3FAvFJ0Vtag', 'https://youtu.be/i1YgFZB6alI?t=487'),
      e('A2: EZ Bar Curl',0,2,'12–15','10','~1.5 min','Arc the bar "out" not "up", focus on squeezing your biceps.','DB Curl','Cable EZ Curl', 'https://youtu.be/94DXwlcX8Po?t=106', 'https://youtu.be/popGXI-qs98?t=123', 'https://youtu.be/K4E8CXajqfQ'),
    ]),
    d('Lower A','lower',[
      e('Hack Squat (Heavy)','2–3',1,'4–6','8–9','~3 min','Focus on strength here. Each week add weight or reps. Keep form consistent.','Machine Squat','Leg Press', 'https://youtu.be/wEgQUCdtFLg', 'https://youtu.be/N56STpGGRYE', 'https://youtu.be/didU4ZwAkPI?t=241'),
      e('Hack Squat (Back off)',0,1,'8–10','8–9','~3 min','Drop the weight back and focus on controlling the negative. Smooth and consistent rep tempo.','Machine Squat','Leg Press', 'https://youtu.be/wEgQUCdtFLg', 'https://youtu.be/N56STpGGRYE', 'https://youtu.be/didU4ZwAkPI?t=241'),
      e('Seated Hamstring Curl',1,1,'10–12 (dropset)','10','~1.5 min','Dropset: perform 10–12 reps, drop weight by ~50%, perform additional 10–12 reps. Do seated if available.','Nordic Ham Curl','Lying Leg Curl', 'https://youtu.be/2CMmuH4qJh0', 'https://youtu.be/qVek72z3F1U?t=683', 'https://www.youtube.com/watch?v=e_48W0vlU58&feature=youtu.be'),
      e('A1: Standing Calf Raise',1,2,'10–12','9–10','0 min','Press all the way up to your toes, stretch your calves at the bottom, don\'t bounce.','Seated Calf Raise','Leg Press Toe Press', 'https://youtu.be/-qsRtp_PbVM?t=162', 'https://youtu.be/-qsRtp_PbVM?t=311', 'https://youtu.be/VJ_9xii47Sk'),
      e('A2: Hanging Leg Raise',0,2,'10–12','9–10','~1.5 min','Knees to chest, controlled reps, straighten legs more to increase difficulty.','Roman Chair Crunch','Reverse Crunch', 'https://youtu.be/2RrGnjxSsiA?t=247', 'https://youtu.be/CFPB3QT19rE', 'https://youtu.be/dd1WoEcQB4c'),
    ]),
    d('Upper B','upper',[
      e('Pendlay Row',2,2,'8–10','9–10','~2 min','Initiate the movement by squeezing your shoulder blades together, pull to your lower chest, avoid using momentum.','T-Bar Row','Seated Cable Row', 'https://youtu.be/_oyxCn2iSjU?t=95', 'https://youtu.be/V5u2AP9wBwE', 'https://youtu.be/J46aPqFl0WE?t=178'),
      e('Machine Shoulder Press',2,2,'10–12','9–10','~2 min','Don\'t stop in between reps, keep smooth and controlled tension on the delts.','Seated DB Shoulder Press','Standing DB Arnold Press', 'https://youtu.be/ljO4jkwv8wQ?t=202', 'https://youtu.be/Hdc7Mw6BIEE?t=99', 'https://youtu.be/cP77gUDvAPA?t=745'),
      e('Weighted Pullup',1,2,'8–10','9–10','~2 min','Pull your elbows down and in, minimize swinging.','Lat Pulldown','Neutral-Grip Pullup', 'https://youtu.be/-qsRtp_PbVM?t=311', 'https://youtu.be/-qsRtp_PbVM?t=162', 'https://youtu.be/VJ_9xii47Sk'),
      e('Cable Chest Press',2,2,'10–12 (dropset)','9–10','~2 min','Can be performed seated or standing. Focus on squeezing your chest. Load set: dropset – 10–12 reps, drop ~50%, perform additional 10–12 reps.','Weighted Dip','Flat DB Press', 'https://youtu.be/2RrGnjxSsiA?t=124', 'https://youtu.be/PRcz1uIkqko', 'https://youtu.be/zU6X6DLCH_U'),

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let S = {
  startDate: null,       // ISO string of day 0
  statuses: {},          // dayIndex -> 'done'|'skipped'
  loads: {},             // "dayIndex-exIndex" -> string
  currentTab: 'today',
  detailDayIndex: null,
};

function save(){ localStorage.setItem('ess3',JSON.stringify(S)) }
function load(){
  try{ const r=localStorage.getItem('ess3'); if(r) S={...S,...JSON.parse(r)} }catch(e){}
  if(!S.startDate){ S.startDate=new Date().toISOString().split('T')[0]; }
}

const SESSION_COLORS = {
  'Upper A': '#00E5A0',
  'Upper B': '#0A84FF',
  'Lower A': '#FF9F0A',
  'Lower B': '#FF453A',
};
function getSessionColor(label){
  for(const key of Object.keys(SESSION_COLORS)){
    if(label.includes(key)) return SESSION_COLORS[key];
  }
  return '#00E5A0';
}

function getTodayDayIndex(){
  // First day without a status (done or skipped)
  for(let i=0;i<PLAN.length;i++){
    if(!S.statuses[i]) return i;
  }
  return PLAN.length-1; // all done
}

function dayLabel(day){
  const types={upper:'Upper Body',lower:'Lower Body'};
  return `${day.label} (${types[day.type]})`;
}

function dateForDay(dayIndex){
  if(S.completedDates&&S.completedDates[dayIndex]){
    return new Date(S.completedDates[dayIndex]).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'});
  }
  return null;
}

// ═══════════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════════
function getLoad(dayIndex,exIndex){
  return S.loads[`${dayIndex}-${exIndex}`]||'';
}
function setLoad(dayIndex,exIndex,val){
  S.loads[`${dayIndex}-${exIndex}`]=val;
  save();
}

function buildExerciseCards(day, editable){
  return day.exercises.map((ex,i)=>`
    <div class="ex-card${getLoad(day.dayIndex,i)?` has-load`:``}" id="ex-card-${day.dayIndex}-${i}">
      <div class="ex-top">
        <div class="ex-name-block">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets">
            Sets: ${ex.warmup!==0?`<span style="color:var(--t4)">${ex.warmup} Warm-Up · </span>`:''}
            <span style="color:var(--session-color,var(--green));font-weight:700">${ex.working} Working Set</span>
          </div>

        </div>
        <button class="ex-check${getLoad(day.dayIndex,i)?' active':''}" id="ex-check-${day.dayIndex}-${i}" onclick="handleCheck(${day.dayIndex},${i})">✓</button>
        <button class="info-btn" onclick="openModal(${day.dayIndex},${i})">ⓘ</button>
      </div>
      <div class="ex-bottom">
        <span class="load-label">Load</span>
        <input class="load-input" type="text" inputmode="decimal"
          placeholder="e.g. 40"
          value="${getLoad(day.dayIndex,i)}"
          ${editable?`onchange="setLoad(${day.dayIndex},${i},this.value);const _v=this.value.trim()!=='';document.getElementById('ex-card-${day.dayIndex}-${i}').classList.toggle('has-load',_v);document.getElementById('ex-check-${day.dayIndex}-${i}').classList.toggle('active',_v)"`:'readonly'}
          style="${!editable?'opacity:.5;pointer-events:none':''}">
        <span class="load-unit">kg</span>
      </div>
    </div>
  `).join('');
}

function buildFinishBar(dayIndex, containerType){
  const status=S.statuses[dayIndex];
  if(containerType==='current'){
    if(!status) return `
      <div id="finish-bar">
        <button class="btn btn-done" onclick="markDay(${dayIndex},'done')">✓ Complete Workout</button>
        <button class="btn btn-skip" onclick="markDay(${dayIndex},'skipped')">Skip</button>
      </div>`;
    if(status==='done') return `<div id="finish-bar"><button class="btn" style="background:var(--green-dim);color:var(--green)" onclick="markDay(${dayIndex},null)">✓ Done – undo?</button></div>`;
    if(status==='skipped') return `<div id="finish-bar"><button class="btn" style="background:rgba(255,69,58,.12);color:var(--red)" onclick="markDay(${dayIndex},null)">Skipped – undo?</button></div>`;
  }
  // detail view
  return '';
}

// ═══════════════════════════════════════════
// TAB RENDERS
// ═══════════════════════════════════════════
function renderToday(){
  const todayIdx=getTodayDayIndex();
  const day=PLAN[todayIdx];
  const status=S.statuses[todayIdx];
  let statusBanner='';
  if(status==='done') statusBanner=`<div style="margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:var(--green-dim);color:var(--green);font-size:13px;font-weight:600">✓ Workout complete</div>`;
  if(status==='skipped') statusBanner=`<div style="margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:rgba(255,69,58,.1);color:var(--red);font-size:13px;font-weight:600">Workout skipped</div>`;

  document.getElementById('content').innerHTML=`
    <div id="cur-header">
      <div class="cur-tag" style="color:${getSessionColor(day.label)}">Today</div>
      <div class="cur-title">${day.label}</div>
      <div class="cur-sub">${day.type==='upper'?'Upper Body':'Lower Body'} · ${day.exercises.length} Exercises</div>

    </div>
    ${statusBanner}
    <div id="exercises" style="--session-color:${getSessionColor(day.label)}">${buildExerciseCards(day,true)}</div>
    ${buildFinishBar(todayIdx,'current')}
  `;
}

function renderPast(){
  const todayIdx=getTodayDayIndex();
  const past=PLAN.filter(d=>d.dayIndex<todayIdx);
  if(!past.length){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="empty-icon">🕐</div><div class="empty-txt">Noch keine vergangenen Training Daye.</div></div>`;
    return;
  }
  const rows=past.slice().reverse().map(day=>{
    const st=S.statuses[day.dayIndex];
    let numCls='upcoming', badge='';
    if(st==='done'){numCls='done';badge=`<span class="day-badge badge-done">Done</span>`;}
    else if(st==='skipped'){numCls='skipped';badge=`<span class="day-badge badge-skip">Skipped</span>`;}
    else{numCls='upcoming';}
    const sc=getSessionColor(day.label);
    return `<div class="day-row" onclick="openDetail(${day.dayIndex})">
      <div class="day-num ${numCls}" style="${!st?`background:${sc}18;color:${sc}`:''}"> ${st==='done'?'✓':st==='skipped'?'✕':day.dayIndex+1}</div>
      <div class="day-info">
        <div class="day-title">${day.label}</div>
        <div class="day-meta">${dateForDay(day.dayIndex)?dateForDay(day.dayIndex)+' · ':''} ${day.exercises.length} Exercises</div>
      </div>
      ${badge}
      <span class="chevron">›</span>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML=`<div class="section-title">Past Workouts</div>${rows}`;
}

function renderUpcoming(){
  const todayIdx=getTodayDayIndex();
  const upcoming=PLAN.filter(d=>d.dayIndex>todayIdx);
  if(!upcoming.length){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="empty-icon">🏁</div><div class="empty-txt">Program complete!</div></div><div class="add-training-wrap"><button class="add-training-btn" onclick="openSessionPopup()"><span class="add-training-btn-icon">＋</span>Add Workout</button></div>`;
    return;
  }
  const rows=upcoming.map(day=>`
    <div class="day-row" style="border-left:3px solid ${getSessionColor(day.label)}" onclick="openDetail(${day.dayIndex})">
      <div class="day-num upcoming">${day.dayIndex+1}</div>
      <div class="day-info">
        <div class="day-title">${day.label}</div>
        <div class="day-meta">Wo. ${day.week} · ${day.exercises.length} Exercises · ${day.type==='upper'?'Upper Body':'Lower Body'}</div>
      </div>
      <span class="chevron">›</span>
    </div>
  `).join('');
  document.getElementById('content').innerHTML=`<div class="section-title">Upcoming Workouts</div>${rows}<div class="add-training-wrap"><button class="add-training-btn" onclick="openSessionPopup()"><span class="add-training-btn-icon">＋</span>Add Workout</button></div>`;
}

// ═══════════════════════════════════════════
// DETAIL VIEW
// ═══════════════════════════════════════════
function openDetail(dayIndex){
  const day=PLAN[dayIndex];
  const todayIdx=getTodayDayIndex();
  const isPast=dayIndex<todayIdx;
  S.detailDayIndex=dayIndex;

  const dateStr=dateForDay(dayIndex);
  const st=S.statuses[dayIndex];
  const color=getSessionColor(day.label);

  document.getElementById('content').innerHTML=`
    <div class="back-bar" onclick="closeDetail()">
      <span class="back-arrow">‹</span>
      <span class="back-label">Back</span>
    </div>
    <div class="detail-day-title" style="color:${color}">${day.label}</div>
    <div class="detail-day-meta">${dateStr?dateStr+' · ':''}${day.exercises.length} Exercises</div>
    <div id="exercises" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;--session-color:${color}">
      ${buildExerciseCards(day, isPast)}
    </div>
    <div id="finish-bar">
      <button class="btn ${st==='done'?'':'btn-done'}" style="${st==='done'?'background:var(--green-dim);color:var(--green)':''}" onclick="markDay(${dayIndex},${st==='done'?'null':"'done'"});openDetail(${dayIndex})">${st==='done'?'✓ Done – undo?':'✓ Complete Workout'}</button>
      <button class="btn btn-skip" style="${st==='skipped'?'background:rgba(255,69,58,.12);color:var(--red)':''}" onclick="markDay(${dayIndex},${st==='skipped'?'null':"'skipped'"});openDetail(${dayIndex})">${st==='skipped'?'Skipped – undo?':'Skip'}</button>
    </div>
  `;
}

function closeDetail(){
  S.detailDayIndex=null;
  render();
}

// ═══════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════
function openModal(dayIndex,exIndex){
  const ex=PLAN[dayIndex].exercises[exIndex];
  document.getElementById('modal-title').textContent=ex.name;
  document.getElementById('modal-sub').textContent=`${PLAN[dayIndex].label}`;
  function extractVideoId(url) {
    if (!url) return '';
    // youtu.be/ID or youtu.be/ID?t=...
    let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    // youtube.com/watch?v=ID
    m = url.match(/[?&]v=([a-zA-Z0-9_-]+)/);
    if (m) return m[1];
    return '';
  }
  function extractTimestamp(url) {
    if (!url) return '';
    const m = url.match(/[?&]t=(\d+)/);
    return m ? `&start=${m[1]}` : '';
  }
  const videoId = extractVideoId(ex.video);
  const videoTs = extractTimestamp(ex.video);
  const videoEmbed = videoId ? `<div class="modal-video"><iframe src="https://www.youtube.com/embed/${videoId}?rel=0${videoTs}" frameborder="0" allowfullscreen></iframe></div>` : '';
  document.getElementById('modal-body').innerHTML=`
    ${videoEmbed}
    <div class="modal-row"><span class="modal-key">Warm-Up Sets</span><span class="modal-val">${ex.warmup===0?'—':ex.warmup}</span></div>
    <div class="modal-row"><span class="modal-key">Working Sets</span><span class="modal-val">${ex.working}</span></div>
    <div class="modal-row"><span class="modal-key">Reps</span><span class="modal-val">${ex.reps}</span></div>
    <div class="modal-row"><span class="modal-key">RPE</span><span class="modal-val">${ex.rpe}</span></div>
    <div class="modal-row"><span class="modal-key">Rest</span><span class="modal-val">${ex.rest}</span></div>
    ${ex.sub1||ex.sub2?`<div style="height:1px;background:rgba(255,255,255,.04);margin:4px 0"></div><div style="padding:10px 20px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4)">Substitutions</div>
    ${ex.sub1?`<div class="modal-row"><span class="modal-key">Option 1</span><span class="modal-val">${ex.sub1url?`<a class="modal-sub-link" href="${ex.sub1url}" target="_blank">${ex.sub1} ↗</a>`:ex.sub1}</span></div>`:''}
    ${ex.sub2?`<div class="modal-row"><span class="modal-key">Option 2</span><span class="modal-val">${ex.sub2url?`<a class="modal-sub-link" href="${ex.sub2url}" target="_blank">${ex.sub2} ↗</a>`:ex.sub2}</span></div>`:''}`:''}
    ${ex.notes?`<div style="height:1px;background:rgba(255,255,255,.04);margin:4px 0"></div><div style="padding:10px 20px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t4)">Notes</div><div class="modal-notes">${ex.notes}</div>`:''}
  `;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open') }

// ═══════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════
function markDay(dayIndex, status){
  if(status===null){
    delete S.statuses[dayIndex];
    if(S.completedDates) delete S.completedDates[dayIndex];
  } else {
    S.statuses[dayIndex]=status;
    if(!S.completedDates) S.completedDates={};
    S.completedDates[dayIndex]=new Date().toISOString();
  }
  save();
  if(S.detailDayIndex!==null){
    openDetail(dayIndex);
  } else {
    if(status==='done'||status==='skipped'){
      switchTab('past');
    } else {
      render();
    }
  }
}

function switchTab(tab){
  S.currentTab=tab;
  ['past','today','upcoming'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
  });
  render();
}

function render(){
  if(S.currentTab==='today') renderToday();
  else if(S.currentTab==='past') renderPast();
  else renderUpcoming();
}

// ═══════════════════════════════════════════
// SESSION PICKER POPUP
// ═══════════════════════════════════════════

// All unique session templates across blocks
const SESSION_TEMPLATES = [
  {label:'Upper A', block:1, type:'upper'},
  {label:'Lower A', block:1, type:'lower'},
  {label:'Upper B', block:1, type:'upper'},
  {label:'Lower B', block:1, type:'lower'},
  {label:'Upper A', block:2, type:'upper'},
  {label:'Lower A', block:2, type:'lower'},
  {label:'Upper B', block:2, type:'upper'},
  {label:'Lower B', block:2, type:'lower'},
  {label:'Upper A', block:3, type:'upper'},
  {label:'Lower A', block:3, type:'lower'},
  {label:'Upper B', block:3, type:'upper'},
  {label:'Lower B', block:3, type:'lower'},
];

function getNextAutoSession(){
  // Find the last day in PLAN and return the next in sequence
  const last = PLAN[PLAN.length-1];
  const blockSessions = [
    ['Upper A','Lower A','Upper B','Lower B'],
    ['Upper A','Lower A','Upper B','Lower B'],
    ['Upper A','Lower A','Upper B','Lower B'],
  ];
  const blockIdx = Math.floor((last.week-1)/4);
  const sessionOrder = blockSessions[blockIdx];
  const currentPos = sessionOrder.indexOf(last.label);
  const nextPos = (currentPos+1) % 4;
  const nextLabel = sessionOrder[nextPos];
  const nextBlock = nextPos === 0 ? Math.min(blockIdx+1, 2) : blockIdx;
  return {label: nextLabel, block: nextBlock+1};
}

function openSessionPopup(){
  const auto = getNextAutoSession();
  // find the actual session data for auto
  const autoDay = PLAN.slice().reverse().find(d=>d.label===auto.label && Math.ceil(d.week/4)===auto.block)
               || PLAN.slice().reverse().find(d=>d.label===auto.label);

  const typeLabel = t => t==='upper'?'Upper Body':'Lower Body';
  const sc = label => getSessionColor(label);

  // Build manual options — 4 session types with colors
  const manualOptions = ['Upper A','Upper B','Lower A','Lower B'].map(lbl=>{
    const ref = PLAN.slice().reverse().find(d=>d.label===lbl)||PLAN[0];
    const color = sc(lbl);
    return `<button class="spop-tile" style="border-color:${color}22" onclick="addTraining('${lbl}')">
      <div class="spop-tile-bar" style="background:${color}"></div>
      <div class="spop-tile-name">${lbl}</div>
      <div class="spop-tile-meta">${typeLabel(ref.type)} · ${ref.exercises.length} Exercises</div>
    </button>`;
  }).join('');

  document.getElementById('session-popup-body').innerHTML=`
    <button class="spop-auto" onclick="addTrainingAuto()">
      <div class="spop-auto-icon">⚡</div>
      <div>
        <div class="spop-auto-label">Auto · ${auto.label}</div>
        <div class="spop-auto-meta">Next in sequence</div>
      </div>
    </button>
    <div class="spop-divider">Choose manually</div>
    <div class="spop-grid">${manualOptions}</div>
  `;
  document.getElementById('session-popup').classList.add('open');
}

function closeSessionPopup(){
  document.getElementById('session-popup').classList.remove('open');
}

function addTrainingAuto(){
  const auto = getNextAutoSession();
  addTraining(auto.label);
}

function addTraining(label){
  // Find the most recent day with this label as template
  const template = PLAN.slice().reverse().find(d=>d.label===label) || PLAN[0];
  const lastDay = PLAN[PLAN.length-1];
  const newWeek = label==='Upper A' && lastDay.label==='Lower B' ? lastDay.week+1 : lastDay.week;
  const newDay = {
    dayIndex: PLAN.length,
    week: Math.min(newWeek, 12),
    sessionIndex: template.sessionIndex,
    label: template.label,
    type: template.type,
    exercises: template.exercises,
  };
  PLAN.push(newDay);
  closeSessionPopup();
  switchTab('upcoming');
}

// ═══════════════════════════════════════════
// LOAD POPUP
// ═══════════════════════════════════════════
let _popupDay = null, _popupEx = null;

function handleCheck(dayIndex, exIndex){
  const load = getLoad(dayIndex, exIndex);
  if(load){
    // already has load — clear it
    setLoad(dayIndex, exIndex, '');
    document.getElementById(`ex-card-${dayIndex}-${exIndex}`).classList.remove('has-load');
    document.getElementById(`ex-check-${dayIndex}-${exIndex}`).classList.remove('active');
    // also clear the input field if visible
    const inp = document.querySelector(`#ex-card-${dayIndex}-${exIndex} .load-input`);
    if(inp) inp.value = '';
  } else {
    // open popup to enter load
    _popupDay = dayIndex;
    _popupEx = exIndex;
    const ex = PLAN[dayIndex].exercises[exIndex];
    document.getElementById('popup-ex-name').textContent = ex.name;
    document.getElementById('popup-ex-sets').textContent = `${ex.working} × ${ex.reps}`;
    document.getElementById('popup-input').value = '';
    document.getElementById('load-popup').classList.add('open');
    setTimeout(()=>document.getElementById('popup-input').focus(), 100);
  }
}

function saveLoadFromPopup(){
  const val = document.getElementById('popup-input').value.trim();
  if(!val){ closeLoadPopup(); return; }
  setLoad(_popupDay, _popupEx, val);
  // update card
  const card = document.getElementById(`ex-card-${_popupDay}-${_popupEx}`);
  if(card){
    card.classList.add('has-load');
    card.querySelector('.ex-check').classList.add('active');
    const inp = card.querySelector('.load-input');
    if(inp) inp.value = val;
  }
  closeLoadPopup();
}

function closeLoadPopup(){
  document.getElementById('load-popup').classList.remove('open');
  _popupDay = null; _popupEx = null;
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
load();
S.currentTab = 'today';
switchTab('today');
</script>
